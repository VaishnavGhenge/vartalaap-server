services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sessionly
      POSTGRES_PASSWORD: sessionly
      POSTGRES_DB: sessionly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sessionly -d sessionly"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web inbox

volumes:
  postgres_data:
