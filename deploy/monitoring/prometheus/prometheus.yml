global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: vartalaap-api
    metrics_path: /metrics
    scrape_timeout: 10s
    sample_limit: 10000
    static_configs:
      - targets: [sessionly-api.railway.internal:8080]
        labels:
          environment: __ENVIRONMENT__
    authorization:
      type: Bearer
      credentials_file: /tmp/ops-token
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels:
          environment: __ENVIRONMENT__
